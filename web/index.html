<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title data-i18n>LAN Mouse &amp; Keyboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="bar">
    <span id="status-dot" class="dot"></span>
    <span id="status-text" data-i18n>Connecting…</span>
  </header>

  <main>
    <div id="touchpad" class="touchpad">
      <div class="hint" data-i18n-html><strong>Touchpad</strong> · drag to move · tap to click · 2 fingers scroll<br>hold a button and move here = drag / select</div>
    </div>

    <div class="buttons">
      <button id="btn-left" class="btn" data-i18n>Left click</button>
      <button id="btn-right" class="btn" data-i18n>Right click</button>
    </div>

    <!-- Keyboard is always visible, alongside the touchpad -->
    <div id="kb-keys" class="kb-keys"></div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
