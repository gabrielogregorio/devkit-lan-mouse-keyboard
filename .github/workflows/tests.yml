name: Tests Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests (backend, frontend i18n)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment

      - name: Run unit tests
        run: PY=.venv/bin/python ./run-tests.sh

  e2e:
    name: E2E Tests (Playwright, phone viewport)
    needs: unit
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment
        with:
          e2e: 'true'

      - name: Run the page in a phone-sized Chromium
        run: PY=.venv/bin/python RUN_E2E=1 ./run-tests.sh

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            tests/frontend/playwright-report
            tests/frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
